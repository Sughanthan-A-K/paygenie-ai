<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001C64" />
      <stop offset="50%" stop-color="#003087" />
      <stop offset="100%" stop-color="#0070BA" />
    </linearGradient>

    <!-- PayPal Primary 'P' Gradient -->
    <linearGradient id="ppPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0079C1" />
      <stop offset="100%" stop-color="#00457C" />
    </linearGradient>

    <!-- PayPal Secondary 'P' Gradient -->
    <linearGradient id="ppSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00457C" />
      <stop offset="100%" stop-color="#002447" />
    </linearGradient>

    <!-- Gold AI Magic Sparkle Gradient -->
    <linearGradient id="magicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="40%" stop-color="#FFC439" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle border ring -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Interlocking Double 'P' Monogram -->
  <g transform="translate(68, 70)">
    <!-- Back 'P' (Deep Navy / Blue) -->
    <path d="M 96 48 L 220 48 C 290 48 338 88 322 158 C 308 220 252 258 184 258 L 132 258 L 94 416 L 36 416 L 96 48 Z" 
          fill="url(#ppSecondary)" opacity="0.9" />

    <!-- Front 'P' (Vibrant PayPal Cyan Blue) -->
    <path d="M 148 102 L 268 102 C 336 102 376 138 360 206 C 344 274 290 310 220 310 L 176 310 L 152 416 L 96 416 L 148 102 Z" 
          fill="url(#ppPrimary)" />

    <!-- Intersecting Cutout / Highlight -->
    <path d="M 176 310 L 220 310 C 274 310 316 284 334 238 C 314 252 284 258 244 258 L 188 258 L 176 310 Z" 
          fill="#002447" opacity="0.45" />
  </g>

  <!-- AI Magic 4-point Stars (Sparkles) -->
  <!-- Main Large Gold Star in Top Right -->
  <g transform="translate(366, 78)" filter="url(#glow)">
    <path d="M 38 0 Q 38 38 76 38 Q 38 38 38 76 Q 38 38 0 38 Q 38 38 38 0 Z" fill="url(#magicGold)" />
  </g>

  <!-- Medium Cyan AI Star bottom right -->
  <g transform="translate(398, 250)">
    <path d="M 22 0 Q 22 22 44 22 Q 22 22 22 44 Q 22 22 0 22 Q 22 22 22 0 Z" fill="url(#cyanSpark)" />
  </g>

  <!-- Small Diamond Sparkle top left -->
  <g transform="translate(90, 72)">
    <path d="M 14 0 Q 14 14 28 14 Q 14 14 14 28 Q 14 14 0 14 Q 14 14 14 0 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
